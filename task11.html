<HTML>
     <HEAD>
          <META CHARSET="UTF-8">
          <TITLE>Учебный файл HTML</TITLE>
     </HEAD>
     <BODY BGCOLOR="#FFFFCC" TEXT="#330066">
        <P ALIGN="CENTER">
        <FONT COLOR="#008080" SIZE="7">
        <B>Расписание</B></FONT><BR>
        <FONT SIZE="6"><I> занятий на вторник</I></FONT>
        </P>
        <P>ALT и BORDER:
        <IMG SRC="clock.png" ALT="Часы" BORDER="3" WIDTH="100" HEIGHT="100"></P>
        <P>ALIGN="TOP": <IMG SRC="clock.png" ALIGN="TOP" WIDTH="100" HEIGHT="100"> текст сверху</P>
        <P>ALIGN="MIDDLE": <IMG SRC="clock.png" ALIGN="MIDDLE" WIDTH="100" HEIGHT="100"> текст посередине</P>
        <P>ALIGN="BOTTOM": <IMG SRC="clock.png" ALIGN="BOTTOM" WIDTH="100" HEIGHT="100"> текст снизу</P>
        <P>HEIGHT и WIDTH (растянуто): <IMG SRC="clock.png" HEIGHT="111" WIDTH="210"></P>
        <P>VSPACE и HSPACE:
        <IMG SRC="clock.png" WIDTH="80" HEIGHT="80" VSPACE="8" HSPACE="8"><IMG SRC="clock.png" WIDTH="80" HEIGHT="80" VSPACE="8" HSPACE="8"></P>
        <P>Нет файла, виден ALT: <IMG SRC="net-takogo-faila.png" ALT="Картинка"></P>
     </BODY>
</HTML>
